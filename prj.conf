# ==============================================================================
# File: zephyr_project/prj.conf
# Mục đích: Cấu hình tính năng Kconfig cho dự án Automotive CAN Gateway & Cluster
# ==============================================================================

# 1. Bật hệ thống CAN Bus và GPIO điều khiển
CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80
CONFIG_CAN_MAX_FILTER=5
CONFIG_GPIO=y

# 2. Bật hệ thống Console UART và Ghi Log Bất Đồng Bộ
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# 3. Khiên bảo vệ tràn ngăn xếp bằng phần cứng MPU Cortex-M7
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y

# 4. Giám sát độ đầy Stack và Đặt tên cho các Thread lúc Runtime
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10

# 5. Giao diện dòng lệnh tương tác chẩn đoán Zephyr Shell CLI
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="ecu:~$ "
